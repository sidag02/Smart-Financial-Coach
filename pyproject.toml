[project]
name = "smart-financial-coach"
version = "0.1.0"
description = "Personal finance coach: statistical models compute every number, an LLM assistant explains them."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "pydantic",
    "pydantic-settings",
    # access/mcp_server.py's _reject_unknown_arguments uses the SDK's private _tool_manager and
    # fn_metadata.arg_model (#47): after upgrading mcp, check it still makes tools strict
    # (tests/unit/access/test_mcp.py fails if it doesn't)
    "mcp",
    "pyyaml",
    "holidays",
    "scipy",
    "joblib",
    "fastembed",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "itsdangerous>=2.2.0",
    "anthropic>=1.11.0",
    "statsmodels>=0.15.0",
]

[project.scripts]
sfc-data = "smart_financial_coach.data.generator.cli:main"
sfc-experiment = "smart_financial_coach.evaluation.cli:experiment_main"
sfc-model = "smart_financial_coach.evaluation.cli:model_main"
sfc-web = "smart_financial_coach.experience.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pandas-stubs",
    "pre-commit",
    "types-pyyaml",
    "scipy-stubs",
    "httpx>=0.28.1",
]
train = [
    "mlflow",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
# `train` (MLflow) is for experiments; a serving install uses --no-default-groups
default-groups = ["dev", "train"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "PTH", "PT", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Reasons are user-facing copy: "About 9× your usual charge" uses the multiplication sign
"src/smart_financial_coach/intelligence/anomaly/reasons.py" = ["RUF001", "RUF002"]
"tests/unit/intelligence/test_anomaly_contract.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "statsmodels.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = [
    "slow: long-running tests (e.g. full evaluation suite)",
    "llm: tests that call a hosted LLM API",
]

[tool.coverage.run]
source = ["src/smart_financial_coach"]
branch = true
