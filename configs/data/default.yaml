# Main synthetic dataset. Every generator parameter lives in this file, the persona files and
# the merchant catalog; other specs `extends:` this one and override what they need.
name: default

calendar:
  start: 2023-10-01
  end: 2026-09-30

# Train and test users come from separate seeds; holdout merchants appear only for test users.
populations:
  - {name: train, split: train, seed: 1001, id_prefix: tr, users: {young_professional: 80, family_budgeter: 80, freelancer: 80}}
  - {name: test, split: test, seed: 2002, id_prefix: te, users: {young_professional: 40, family_budgeter: 40, freelancer: 40}}

personas: personas/

catalog:
  merchants: merchants.csv
  # FR-4: a 40% holdout (115 merchants, against 58 at 20%) narrows the unseen-merchant interval
  # and, with a new seed, gives a test set nothing has been scored on. FR-3's dataset (share 0.2,
  # seed 7, bias 1.25, schema 3) is reproducible from the git tag `data/fr3-default`.
  holdout:
    share: 0.4
    exclude_top_n_per_category: 3
    exclude_categories: [Income]
    test_user_bias: 0.45   # tuned so ~15-25% of test users' spending is at holdout merchants
    test_share_range: [0.15, 0.25]   # validation fails outside this (with 30+ test users)
    seed: 8

rendering:
  distortion: realistic   # none | light | realistic | heavy
  seed: 11

events:
  one_off: {rate_scale: 1.0}
  unusual_charge:
    rate_per_user_year: 1.5
    kinds: [duplicate, amount_outlier, new_merchant_large]
    outlier_multiplier: [6, 15]
    new_merchant_categories: [Shopping, Travel, Entertainment]
    new_merchant_min_amount: 250
  spending_spike:
    rate_per_user_year: 1.0
    multiplier: [1.8, 3.0]
    granularity: [week, month]
  refunds: {share: 0.03, categories: [Shopping], lag_days: [3, 20]}

goals:
  per_user: [1, 2]
  outcome_mix: {on_track: 0.34, borderline: 0.33, off_track: 0.33}
  target_inside_history_share: 0.5
  allocation_share: [0.5, 0.9]
  forecast_horizon_months: [3, 12]   # as_of_date to target_date for goals inside the history

# FR-2 label contract: how flags are scored against ground truth, and the label checks.
labels:
  weak_lift: 1.3                 # a spike is weak when realized spend < expected x this
  max_weak_share: 0.15           # of monthly spike labels
  max_drivers: 5                 # driving transactions returned per spike
  duplicate_window_minutes: 90
  oracle_recall: 0.5             # oracle precision is measured at this recall...
  oracle_min_precision: 0.70     # ...and validate fails below this (PRD target)

# FR-5/FR-6 data contract (schema 4, accepted on PR #15): some test users see a merchant subtype
# in another category. Each remap's rate tests one outcome of the feedback agreement rule. Train
# users never get preferences; FR-4's gates stay on the true category.
preferences:
  seed: 13
  remaps:
    - {subtype: warehouse, category: Shopping, share: 0.3}         # minority stays personal
    - {subtype: gym, category: Subscriptions, share: 0.3}          # minority, weakest category
    - {subtype: pharmacy, category: Shopping, share: 0.3}          # minority stays personal
    - {subtype: rideshare, category: Travel, share: 0.3}           # minority, old fallback category
    - {subtype: books, category: Entertainment, share: 0.5}        # split: labels flip, get revoked
    - {subtype: streaming, category: Entertainment, share: 0.7}    # majority becomes a global label
