  - {category: Utilities, subtypes: [electric], probability: 0.8, amount: [35, 90], day_of_month: [8, 22], jitter_days: 1, amount_noise: 0.08,
     seasonality: {1: 1.35, 2: 1.25, 3: 1.05, 4: 0.9, 5: 0.9, 6: 1.1, 7: 1.35, 8: 1.35, 9: 1.1, 10: 0.9, 11: 1.0, 12: 1.25}}
