# FR-8 round: the same expectation with a negative-binomial tail, over-dispersion from the user's
# trailing count variance shrunk toward a pooled value (FR-8 §3). Synthetic counts are Poisson by
# construction, so this is the variant for real data; decision 6 prefers it in a tie.
name: count_negbin
task: spending_spikes
model:
  type: spending_spikes/thresholded
  params:
    precision: 0.80
    base: {$model: {type: spending_spikes/count, params: {dispersion: negbin}}}
    search: {kappa: [0.5, 1.0, 2.0]}
complexity: 3
tags: {plan: fr8-round}
