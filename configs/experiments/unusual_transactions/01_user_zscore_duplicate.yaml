# FR-7 round 0, reported only: the per-user z baseline plus the exact-duplicate rule. The owner
# decided on #30 that it's reported alongside and never gated, since choosing the bar after seeing
# which rule works would move it. It isn't in the task's required baselines.
name: user_zscore_duplicate
task: unusual_transactions
model:
  type: unusual_transactions/thresholded
  params:
    precision: 0.80
    base: {$model: {type: unusual_transactions/user_zscore, params: {repeats: true}}}
baseline: true
tags: {plan: fr7-round}
