model:
  type: unusual_transactions/thresholded
  params:
    precision: 0.80
    base: {$model: {type: unusual_transactions/isolation_forest, params: {seed: 0, one_sided_rank: true}}}
complexity: 3
tags: {plan: fr7-round, added: after-test-scoring}
