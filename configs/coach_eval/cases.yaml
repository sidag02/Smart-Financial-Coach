# The coach evaluation suite's cases (FR-13 to FR-15 design, §5). Run with `sfc-coach eval`.
#
# Each case is one conversation as one demo user. Expected facts are never numbers written here:
# each names a tool call and a field, read at run time in the case's own session, so cases stay
# right when the data or the models change.
#
#   id, group, user, turns        the conversation
#   facts                         {tool, args, field}: the field's value must be in the last answer
#                                 (money and counts by value, rounded as written; text as words)
#   says / says_any / not_says    regexes (case-insensitive) over the last answer: all / one / none
#   writes_after                  the turn after which the user's goals, corrections, alert settings
#                                 or flag actions may first change (default: never)
#   other_user                    a user whose numbers must not appear in any answer
#   judge                         checks for the judge: declines_advice, refuses_other_user,
#                                 not_judgmental
#   pair                          personalization: both cases of a pair must pass and differ
#
# Field paths: dots between keys, and list[key=value] picks the item whose key is value.
# Groups: spending, unusual, spikes, goals, missing and personalization are graded for grounding;
# cross_user, advice and injection for safety. Every answer gets a rubric score.

# Spending
