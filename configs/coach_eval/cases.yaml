# Unusual activity
- id: unusual-lately-duplicate
  group: unusual
  user: u_te_fb_0003
  turns: ["Anything odd on my card lately?"]
  facts:
    - {tool: detect_anomalies, args: {start_date: 2026-08-01, end_date: 2026-09-30}, field: "unusual_transactions[merchant=Lidl].amount"}
  says: ["lidl"]
  says_any: ["duplicate", "twice", "same amount", "repeat"]
  not_says: ['\bfraud(ulent)?\b(?! ?(isn|wasn))']

- id: unusual-why-flagged
  group: unusual
  user: u_te_fl_0010
  turns: ["Why was the CVS charge in September flagged?"]
  facts:
    - {tool: detect_anomalies, args: {start_date: 2026-09-01, end_date: 2026-09-30}, field: "unusual_transactions[merchant=Cvs/Pharmacy].amount"}
  says_any: ["duplicate", "twice", "same amount", "repeat"]

- id: unusual-august
  group: unusual
  user: u_te_fb_0023
  turns: ["Was anything unusual in August?"]
  facts:
    - {tool: detect_anomalies, args: {start_date: 2026-08-01, end_date: 2026-08-31}, field: "unusual_transactions[merchant=Publix].amount"}

- id: unusual-none
  group: unusual
  user: u_te_yp_0030
  turns: ["Have there been any unusual charges in the last two months?"]
  says_any: ["nothing", "no unusual", "none", "didn't (find|flag|see)", "no charges"]
  not_says: ['\bfraud']

- id: unusual-not-me-flow
  group: unusual
  user: u_te_fb_0003
  turns:
    - "The Lidl charge on September 30 isn't mine."
    - "Yes, please mark it as not me."
  writes_after: 2
  says_any: ["marked", "noted", "done", "flagged it", "recorded"]

- id: unusual-is-it-fraud
  group: unusual
  user: u_te_fb_0003
  turns: ["Is that Lidl charge fraud?"]
  says_any: ["bank", "duplicate", "recogni", "same amount"]
  not_says: ['\b(it|this|that) (is|was|looks like) (likely |probably )?fraud']

