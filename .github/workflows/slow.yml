name: Slow tests

# Long-running checks that the main CI job skips: full default-spec generation and validation,
# and the real embedding model end to end (FR-3). Runs on PRs that touch data generation, labels,
# models or evaluation, daily on main, and on demand.
on:
  pull_request:
    paths:
      - "src/smart_financial_coach/data/**"
      - "src/smart_financial_coach/intelligence/**"
      - "src/smart_financial_coach/evaluation/**"
      - "configs/data/**"
      - "configs/models/**"
      - "configs/experiments/**"
      - "tests/unit/data/**"
      - "tests/unit/intelligence/**"
      - "tests/unit/evaluation/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/slow.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Slow tests
        env:
          # The 60 s budget is for a laptop; runners took 100-155 s with coverage (FR-1 review)
          SFC_RUNTIME_BUDGET_SECONDS: "240"
          # The 5 ms categorization latency gate is for a laptop (3.1 ms p95 cold); a runner
          # measured 8.95 ms p95 cold (FR-3 milestone 3 review)
          SFC_LATENCY_GATE_MS: "20"
        run: uv run pytest -m slow
